<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 24px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 14px; fill: #64748b; }
      .section-badge { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .block-title { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 14px; font-weight: bold; fill: #1e3a8a; }
      .block-text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 12px; fill: #334155; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; font-size: 11px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 전체 배경 -->
  <rect width="1000" height="850" fill="#f8fafc" rx="16"/>

  <!-- 상단 타이틀 -->
  <text x="500" y="45" text-anchor="middle" class="title">🗺️ DriveWave 웹 서비스 블록 &amp; 링크 구조도</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">웹프로그래밍 과제 제안서 와이어프레임 설계 (블록 분할 • 화면 이동 • CSS 계획)</text>

  <!-- ================= PAGE 1 ================= -->
  <g transform="translate(40, 95)">
    <!-- 페이지 외곽선 -->
    <rect width="920" height="385" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,6" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <rect x="25" y="-12" width="230" height="26" fill="#3b82f6" rx="13"/>
    <text x="140" y="5" text-anchor="middle" class="section-badge">PAGE 1 : 메인 페이지 (index.html)</text>

    <!-- 블록 1: 헤더 -->
    <g transform="translate(25, 25)">
      <rect width="870" height="55" fill="#f5f3ff" stroke="#6366f1" stroke-width="2" rx="8"/>
      <text x="15" y="25" class="block-title">블록 1 : 상단 헤더 (GNB)</text>
      <text x="15" y="44" class="block-text">로고 [DriveWave]  |  메뉴: [코스 탐색]  [코스 등록]  |  검색창</text>
      <rect x="520" y="16" width="135" height="24" fill="#fef3c7" rx="4"/>
      <text x="587" y="32" text-anchor="middle" class="badge-text" fill="#92400e">CSS: sticky, flex</text>
      <rect x="665" y="16" width="190" height="24" fill="#ecfdf5" rx="4"/>
      <text x="760" y="32" text-anchor="middle" class="badge-text" fill="#065f46">👉 [로그인/회원가입] 이동</text>
    </g>

    <!-- 블록 2: 날씨 배너 -->
    <g transform="translate(25, 90)">
      <rect width="870" height="55" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
      <text x="15" y="24" class="block-title">블록 2 : 실시간 날씨 &amp; 테마 필터 배너 (OpenWeather API)</text>
      <text x="15" y="43" class="block-text">⛅ 현재 서울 18℃ 맑음! 추천 테마 태그:  [#야경드라이브]  [#오션뷰카페]  [#비오는날]  [#단풍로드]</text>
      <rect x="680" y="16" width="175" height="24" fill="#fef3c7" rx="4"/>
      <text x="767" y="32" text-anchor="middle" class="badge-text" fill="#92400e">CSS: linear-gradient, hover</text>
    </g>

    <!-- 블록 3: 추천 코스 그리드 -->
    <g transform="translate(25, 155)">
      <rect width="870" height="150" fill="#ffffff" stroke="#3b82f6" stroke-width="2" rx="8"/>
      <text x="15" y="25" class="block-title">블록 3 : 테마별 추천 코스 카드 그리드</text>
      <rect x="620" y="10" width="235" height="24" fill="#ecfdf5" rx="4"/>
      <text x="737" y="26" text-anchor="middle" class="badge-text" fill="#065f46">👉 카드 클릭 시 [코스 상세 &amp; 지도] 이동</text>

      <!-- 카드 1 -->
      <g transform="translate(20, 40)">
        <rect width="260" height="95" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
        <rect x="10" y="10" width="70" height="75" fill="#e2e8f0" rx="4"/>
        <text x="45" y="52" text-anchor="middle" font-size="11" fill="#94a3b8">🚗 썸네일</text>
        <text x="90" y="32" font-size="13" font-weight="bold" fill="#0f172a">북악스카이웨이 야경</text>
        <text x="90" y="55" font-size="11" fill="#64748b">소요시간: 2시간</text>
        <text x="90" y="75" font-size="11" fill="#ef4444">♥ 좋아요 142개</text>
      </g>
      <!-- 카드 2 -->
      <g transform="translate(305, 40)">
        <rect width="260" height="95" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
        <rect x="10" y="10" width="70" height="75" fill="#e2e8f0" rx="4"/>
        <text x="45" y="52" text-anchor="middle" font-size="11" fill="#94a3b8">🌊 썸네일</text>
        <text x="90" y="32" font-size="13" font-weight="bold" fill="#0f172a">남양주 북한강 오션뷰</text>
        <text x="90" y="55" font-size="11" fill="#64748b">소요시간: 3시간</text>
        <text x="90" y="75" font-size="11" fill="#ef4444">♥ 좋아요 98개</text>
      </g>
      <!-- 카드 3 -->
      <g transform="translate(590, 40)">
        <rect width="260" height="95" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
        <rect x="10" y="10" width="70" height="75" fill="#e2e8f0" rx="4"/>
        <text x="45" y="52" text-anchor="middle" font-size="11" fill="#94a3b8">🍂 썸네일</text>
        <text x="90" y="32" font-size="13" font-weight="bold" fill="#0f172a">청평호수 단풍로드</text>
        <text x="90" y="55" font-size="11" fill="#64748b">소요시간: 4시간</text>
        <text x="90" y="75" font-size="11" fill="#ef4444">♥ 좋아요 215개</text>
      </g>
    </g>

    <!-- 블록 4: BGM 플레이어 -->
    <g transform="translate(25, 315)">
      <rect width="870" height="50" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="8"/>
      <text x="15" y="24" class="block-title" fill="#b91c1c">블록 4 : 감성 드라이브 BGM 플레이어 (YouTube API)</text>
      <text x="15" y="41" class="block-text">🎵 "심야 드라이브 감성 로파이 팝 플레이리스트" (유튜브 영상 임베드 &amp; 미니 컨트롤 바)</text>
      <rect x="680" y="13" width="175" height="24" fill="#fef3c7" rx="4"/>
      <text x="767" y="29" text-anchor="middle" class="badge-text" fill="#92400e">CSS: fixed bottom, shadow</text>
    </g>
  </g>

  <!-- 이동 연결선 표시 -->
  <g transform="translate(500, 505)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">▼ 코스 카드 클릭 시 이동</text>
  </g>

  <!-- ================= PAGE 2 ================= -->
  <g transform="translate(40, 525)">
    <!-- 페이지 외곽선 -->
    <rect width="920" height="295" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6,6" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <rect x="25" y="-12" width="290" height="26" fill="#10b981" rx="13"/>
    <text x="170" y="5" text-anchor="middle" class="section-badge">PAGE 2 : 코스 상세 &amp; 지도 페이지 (detail.html)</text>

    <!-- 블록 5: 좌측 동선 타임라인 -->
    <g transform="translate(25, 25)">
      <rect width="360" height="180" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" rx="8"/>
      <text x="15" y="25" class="block-title">블록 5 : 1~3차 동선 타임라인 (좌측)</text>
      <text x="15" y="55" class="block-text" font-weight="bold">📍 1차 : 성북동 뷰맛집 카페 (출발)</text>
      <text x="15" y="85" class="block-text" font-weight="bold">📍 2차 : 북악 팔각정 야경 조망 (메인 스팟)</text>
      <text x="15" y="115" class="block-text" font-weight="bold">📍 3차 : 부암동 심야 식당 (도착)</text>
      <text x="15" y="145" font-size="11" fill="#64748b">• 장소 클릭 시 우측 지도 마커로 카메라 이동</text>
      <rect x="15" y="152" width="180" height="20" fill="#fef3c7" rx="4"/>
      <text x="105" y="166" text-anchor="middle" class="badge-text" fill="#92400e">CSS: flex-direction: column</text>
    </g>

    <!-- 블록 6: 우측 지도 영역 -->
    <g transform="translate(400, 25)">
      <rect width="495" height="180" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
      <text x="15" y="25" class="block-title" fill="#0369a1">블록 6 : 카카오 지도 렌더링 영역 (우측)</text>
      
      <!-- 지도 시각화 그래픽 -->
      <path d="M 50 110 Q 150 60 250 110 T 430 80" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="4,4"/>
      <circle cx="50" cy="110" r="12" fill="#ef4444"/>
      <text x="50" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">1</text>
      <circle cx="250" cy="110" r="12" fill="#ef4444"/>
      <text x="250" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">2</text>
      <circle cx="430" cy="80" r="12" fill="#ef4444"/>
      <text x="430" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">3</text>
      
      <text x="250" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">🗺️ Kakao Maps API (마커 1, 2, 3 &amp; 경로 Polyline 선)</text>
      <rect x="330" y="8" width="150" height="22" fill="#fef3c7" rx="4"/>
      <text x="405" y="23" text-anchor="middle" class="badge-text" fill="#92400e">CSS: border-radius, 100%</text>
    </g>

    <!-- 블록 7: 댓글 및 찜하기 -->
    <g transform="translate(25, 220)">
      <rect width="870" height="55" fill="#ffffff" stroke="#64748b" stroke-width="2" rx="8"/>
      <text x="15" y="24" class="block-title">블록 7 : 후기 댓글 및 찜하기 (CRUD 기능)</text>
      <text x="15" y="43" class="block-text">❤️ 찜하기(북마크) 버튼  |  💬 다녀온 사용자 한 줄 평 &amp; 별점 입력 폼  |  댓글 목록(수정/삭제)</text>
      <rect x="680" y="16" width="175" height="24" fill="#fef3c7" rx="4"/>
      <text x="767" y="32" text-anchor="middle" class="badge-text" fill="#92400e">CSS: @keyframes heart-pulse</text>
    </g>
  </g>
</svg>
